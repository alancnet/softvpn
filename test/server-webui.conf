# The web UI test server (webui-server). This file is copied into a
# writable volume, where the web UI edits it; paths are relative to it.
port 1194
proto udp
proto tcp
dev tun
topology subnet
server 10.11.0.0 255.255.255.0

ca   pki/ca.crt
cert pki/server.crt
key  pki/server.key
crl-verify pki/crl.pem

keepalive 10 60
push "redirect-gateway def1"
push "dhcp-option DNS 10.11.0.1"
client-config-dir ccd

# Certificate clients need no password; password users need no certificate.
auth-user-pass-file users
verify-client-cert optional
auth-user-pass-optional
username-as-common-name

status /tmp/softvpn-status.log 5
verb 3

# The web UI (softvpn extension). Administrators: web-ui.users next to this
# file, created on first start with a random password that is logged once.
web-ui 0.0.0.0:8443
