# TAP mode with "server-bridge" and no arguments: clients get no pushed
# ifconfig ("route-gateway dhcp") and configure themselves with DHCP from
# the server's built-in DHCP responder. "server" sets the address range.
port 1194
proto udp
dev tap
server-bridge
server 10.10.0.0 255.255.255.0

ca   /pki/ca.crt
cert /pki/server.crt
key  /pki/server.key
dh none

keepalive 10 60
push "dhcp-option DNS 10.10.0.1"

verb 3
