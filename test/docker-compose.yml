# softvpn end-to-end test.
#
#   wan   (${SVT_NET}.10.0/24, has internet)  server  web
#   edge  (${SVT_NET}.20.0/24, internal: no route anywhere)  server  clients  probe
#
# SVT_ID / SVT_NET (set by run.sh) keep parallel runs apart: project name,
# image tags and subnets all derive from them.
#
# The clients only sit on "edge", which Docker keeps isolated, so anything they
# reach on "wan" or the internet must have gone through the VPN and been
# NATed in software by the server.
#
# server:  no capabilities at all, uid 65534, read-only root filesystem.
# clients: the stock OpenVPN client. Not privileged, but like any OpenVPN
#          client it needs a TUN device, so it gets /dev/net/tun and
#          NET_ADMIN (nothing else).

name: softvpn-test${SVT_ID:-}

x-locked-down: &locked-down
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

networks:
  wan:
    ipam:
      config: [{ subnet: "${SVT_NET:-10.231}.10.0/24" }]
  edge:
    internal: true
    ipam:
      config: [{ subnet: "${SVT_NET:-10.231}.20.0/24" }]

volumes:
  pki:

services:
  # Creates the CA, certificates and client .ovpn profiles (idempotent).
  pki:
    <<: *locked-down
    build: { context: .. }
    image: softvpn:test${SVT_ID:-}
    user: "65534:65534"
    network_mode: none
    volumes: [pki:/pki]
    # -shared: clients run as a different uid; demo volume only.
    command: [pki, init, -dir, /pki, -clients, "client1,client2,client3,cbc-lz4-client,fallback-lzo-client,lz4v2-client,stubv2-client,openvpn23-client", -remote, server, -shared]

  server:
    <<: *locked-down
    image: softvpn:test${SVT_ID:-}
    user: "65534:65534"
    depends_on:
      pki: { condition: service_completed_successfully }
    command: [server, --config, /etc/softvpn/server.conf]
    volumes:
      - pki:/pki:ro
      - ./server.conf:/etc/softvpn/server.conf:ro
      - ./ccd:/etc/softvpn/ccd:ro
    tmpfs: ["/tmp:uid=65534,gid=65534"]
    networks:
      wan: { ipv4_address: "${SVT_NET:-10.231}.10.100" }
      edge: { ipv4_address: "${SVT_NET:-10.231}.20.100" }

  # Stand-in for the internet, reachable only from the server's network.
  web:
    <<: *locked-down
    build: ./tools
    image: softvpn-test-tools${SVT_ID:-}
    user: "65534:65534"
    command: [web.sh]
    networks:
      wan: { ipv4_address: "${SVT_NET:-10.231}.10.10" }

  client1:
    &client
    build: ./tools
    image: softvpn-test-tools${SVT_ID:-}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    depends_on: [server]
    volumes: [pki:/pki:ro]
    # Renegotiate data-channel keys every 15s (default is hourly) so the test
    # exercises OpenVPN's soft-reset path.
    command: [client-entrypoint.sh, --config, /pki/client1.ovpn, --reneg-sec, "15"]
    networks: [edge]

  # Same client over TCP, with a static address from client-config-dir and a
  # small HTTP service that client1 reaches via client-to-client routing.
  client2:
    <<: *client
    command: [client-entrypoint.sh, --config, /pki/client2.ovpn, --proto, tcp-client]
    environment: { SERVE_PORT: "8080" }

  # An older OpenVPN (2.5.10): no tls-ekm, so keys come from OpenVPN's legacy
  # PRF; and it only offers ChaCha20-Poly1305.
  client3:
    <<: *client
    build: { context: ./tools, args: { ALPINE: "3.17" } }
    image: softvpn-test-tools${SVT_ID:-}:openvpn-2.5
    command: [client-entrypoint.sh, --config, /pki/client3.ovpn, --data-ciphers, CHACHA20-POLY1305]

  # Legacy data channel: OpenVPN 2.6 over TCP that only offers AES-256-CBC
  # (HMAC-SHA256), with "compress lz4" (swap framing, set for this client in
  # client-config-dir) compressing in both directions.
  cbc-lz4-client:
    <<: *client
    command: [client-entrypoint.sh, --config, /pki/cbc-lz4-client.ovpn, --proto, tcp-client,
              --data-ciphers, AES-256-CBC, --auth, SHA256,
              --compress, lz4, --allow-compression, "yes"]

  # OpenVPN 2.5 that cannot negotiate a cipher, so the server falls back to
  # data-ciphers-fallback (AES-128-CBC); compresses with comp-lzo.
  fallback-lzo-client:
    <<: *client
    build: { context: ./tools, args: { ALPINE: "3.17" } }
    image: softvpn-test-tools${SVT_ID:-}:openvpn-2.5
    command: [client-entrypoint.sh, --config, /pki/fallback-lzo-client.ovpn, --ncp-disable,
              --cipher, AES-128-CBC, --auth, SHA256,
              --comp-lzo, "yes", --allow-compression, "yes"]

  # "compress lz4-v2", compressing in both directions.
  lz4v2-client:
    <<: *client
    command: [client-entrypoint.sh, --config, /pki/lz4v2-client.ovpn,
              --compress, lz4-v2, --allow-compression, "yes"]

  # "compress stub-v2" with nothing configured for it on the server: softvpn
  # migrates it (pushes stub-v2), like OpenVPN's "compress migrate".
  stubv2-client:
    <<: *client
    command: [client-entrypoint.sh, --config, /pki/stubv2-client.ovpn, --compress, stub-v2]

  # OpenVPN 2.3 (2017 build): no cipher negotiation and no "compress", only
  # comp-lzo. The server takes AES-256-CBC from its options string and
  # migrates it to "comp-lzo no". 2.3's remote-cert-tls wants keyEncipherment
  # in the server certificate (ECDSA certificates have digitalSignature), and
  # it finds no default gateway to redirect on "edge", so it routes "wan".
  openvpn23-client:
    <<: *client
    build: { context: ./tools, args: { ALPINE: "3.5" } }
    image: softvpn-test-tools${SVT_ID:-}:openvpn-2.3
    command: [client-entrypoint.sh, --config, /pki/openvpn23-client.ovpn,
              --cipher, AES-256-CBC, --auth, SHA256, --comp-lzo, --remote-cert-ku, "80",
              --route, "${SVT_NET:-10.231}.10.0", 255.255.255.0]

  # On the same isolated network as the clients but without a VPN: shows that
  # nothing is reachable from "edge" except through the tunnel.
  probe:
    <<: *locked-down
    image: softvpn-test-tools${SVT_ID:-}
    user: "65534:65534"
    command: [sleep, infinity]
    networks: [edge]
