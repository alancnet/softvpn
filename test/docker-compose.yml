# softvpn end-to-end test.
#
#   wan   (${SVT_NET}.10.0/24, ${SVT_NET6}:10::/64, has internet)  server  web
#   edge  (${SVT_NET}.20.0/24, ${SVT_NET6}:20::/64, internal: no route anywhere)
#         server  clients  probe
#   lan   (${SVT_NET}.30.0/24, ${SVT_NET6}:30::/64, internal)  client4  lansvc
#
# SVT_ID / SVT_NET / SVT_NET6 / SVT_CCD (set by run.sh) keep parallel runs
# apart: project name, image tags and subnets all derive from them.
#
# The clients only sit on "edge", which Docker keeps isolated, so anything they
# reach on "wan" or the internet must have gone through the VPN and been
# NATed in software by the server. Inside the tunnel the clients get IPv4
# (10.8.0.0/24) and IPv6 (fd00:8::/64) addresses.
#
# "lan" is a private network behind client4, a site gateway: the server
# routes it to client4 (iroute in its client-config-dir file), and other
# clients reach lansvc on it through the VPN without any NAT.
#
# server:  no capabilities at all, uid 65534, read-only root filesystem.
# clients: the stock OpenVPN client. Not privileged, but like any OpenVPN
#          client it needs a TUN device, so it gets /dev/net/tun and
#          NET_ADMIN (nothing else).

name: softvpn-test${SVT_ID:-}

x-locked-down: &locked-down
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

networks:
  wan:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "${SVT_NET:-10.231}.10.0/24"
        - subnet: "${SVT_NET6:-fd00:231}:10::/64"
  edge:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: "${SVT_NET:-10.231}.20.0/24"
        - subnet: "${SVT_NET6:-fd00:231}:20::/64"
  lan:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: "${SVT_NET:-10.231}.30.0/24"
        - subnet: "${SVT_NET6:-fd00:231}:30::/64"

volumes:
  pki:

services:
  # Creates the CA, certificates and client .ovpn profiles (idempotent).
  pki:
    <<: *locked-down
    build: { context: .. }
    image: softvpn:test${SVT_ID:-}
    user: "65534:65534"
    network_mode: none
    volumes: [pki:/pki]
    # -shared: clients run as a different uid; demo volume only.
    command: [pki, init, -dir, /pki, -clients, "client1,client2,client3,client4", -remote, server, -shared]

  server:
    <<: *locked-down
    image: softvpn:test${SVT_ID:-}
    user: "65534:65534"
    depends_on:
      pki: { condition: service_completed_successfully }
    # client4's LAN is inside the VPN (route, route-ipv6) and every client is
    # told to reach it through the tunnel (push). client4 itself is not: the
    # server leaves out pushed routes to a client's own iroutes.
    command:
      - server
      - --config
      - /etc/softvpn/server.conf
      - --route
      - "${SVT_NET:-10.231}.30.0"
      - 255.255.255.0
      - --route-ipv6
      - "${SVT_NET6:-fd00:231}:30::/64"
      - --push
      - "route ${SVT_NET:-10.231}.30.0 255.255.255.0"
      - --push
      - "route-ipv6 ${SVT_NET6:-fd00:231}:30::/64"
    volumes:
      - pki:/pki:ro
      - ./server.conf:/etc/softvpn/server.conf:ro
      - ${SVT_CCD:-./ccd}:/etc/softvpn/ccd:ro
    tmpfs: ["/tmp:uid=65534,gid=65534"]
    networks:
      wan:
        ipv4_address: "${SVT_NET:-10.231}.10.100"
        ipv6_address: "${SVT_NET6:-fd00:231}:10::100"
      edge:
        ipv4_address: "${SVT_NET:-10.231}.20.100"
        ipv6_address: "${SVT_NET6:-fd00:231}:20::100"

  # Stand-in for the internet, reachable only from the server's network.
  web:
    <<: *locked-down
    build: ./tools
    image: softvpn-test-tools${SVT_ID:-}
    user: "65534:65534"
    command: [web.sh]
    networks:
      wan:
        ipv4_address: "${SVT_NET:-10.231}.10.10"
        ipv6_address: "${SVT_NET6:-fd00:231}:10::10"

  client1:
    &client
    build: ./tools
    image: softvpn-test-tools${SVT_ID:-}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    depends_on: [server]
    volumes: [pki:/pki:ro]
    # Renegotiate data-channel keys every 15s (default is hourly) so the test
    # exercises OpenVPN's soft-reset path.
    command: [client-entrypoint.sh, --config, /pki/client1.ovpn, --reneg-sec, "15"]
    networks: [edge]

  # Same client over TCP, with static addresses from client-config-dir and a
  # small HTTP service that client1 reaches via client-to-client routing.
  client2:
    <<: *client
    command: [client-entrypoint.sh, --config, /pki/client2.ovpn, --proto, tcp-client]
    environment: { SERVE_PORT: "8080" }

  # An older OpenVPN (2.5.10): no tls-ekm, so keys come from OpenVPN's legacy
  # PRF; it only offers ChaCha20-Poly1305; and it reaches the server over
  # IPv6 (udp6).
  client3:
    <<: *client
    build: { context: ./tools, args: { ALPINE: "3.17" } }
    image: softvpn-test-tools${SVT_ID:-}:openvpn-2.5
    command: [client-entrypoint.sh, --config, /pki/client3.ovpn, --data-ciphers, CHACHA20-POLY1305, --proto, udp6]

  # A site gateway: an ordinary client that also sits on "lan" and forwards
  # between it and the tunnel. Forwarding is a per-network-namespace sysctl,
  # which Docker sets without any extra privilege.
  client4:
    <<: *client
    command: [client-entrypoint.sh, --config, /pki/client4.ovpn]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
    networks:
      edge: {}
      lan:
        ipv4_address: "${SVT_NET:-10.231}.30.4"
        ipv6_address: "${SVT_NET6:-fd00:231}:30::4"

  # A host on client4's LAN. As on a real LAN, it needs a route back to the
  # VPN subnets via the site gateway (client4); that is the only reason it
  # gets NET_ADMIN. No NAT anywhere, so it sees the VPN clients' own
  # addresses.
  lansvc:
    image: softvpn-test-tools${SVT_ID:-}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    depends_on: [client4]
    command:
      - sh
      - -c
      - >-
        ip route add 10.8.0.0/24 via ${SVT_NET:-10.231}.30.4 &&
        ip -6 route add fd00:8::/64 via ${SVT_NET6:-fd00:231}:30::4 &&
        exec web.sh
    networks:
      lan:
        ipv4_address: "${SVT_NET:-10.231}.30.10"
        ipv6_address: "${SVT_NET6:-fd00:231}:30::10"

  # On the same isolated network as the clients but without a VPN: shows that
  # nothing is reachable from "edge" except through the tunnel.
  probe:
    <<: *locked-down
    image: softvpn-test-tools${SVT_ID:-}
    user: "65534:65534"
    command: [sleep, infinity]
    networks: [edge]
