# softvpn end-to-end test.
#
#   wan     (${SVT_NET}.10.0/24, has internet)  server  tapserver  dhcpserver  web
#   edge    (${SVT_NET}.20.0/24, internal: no route anywhere)  server  clients  probe
#   tapedge (${SVT_NET}.30.0/24, internal)  tapserver  tapclient1  tapclient2
#   dhcpedge (${SVT_NET}.40.0/24, internal)  dhcpserver  tapclient3
#
# tapserver and dhcpserver are softvpn in TAP (bridged) mode. Each answers
# to the name "server" on its own edge network, so the generated client
# profiles work unchanged; the TAP clients only add --dev tap.
#
# SVT_ID / SVT_NET (set by run.sh) keep parallel runs apart: project name,
# image tags and subnets all derive from them.
#
# The clients only sit on "edge", which Docker keeps isolated, so anything they
# reach on "wan" or the internet must have gone through the VPN and been
# NATed in software by the server.
#
# tlsauth-server, tlscrypt-server and tlscryptv2-server are the same server
# with each kind of control-channel protection, for the tls*-client clients.
#
# server:  no capabilities at all, uid 65534, read-only root filesystem.
# clients: the stock OpenVPN client. Not privileged, but like any OpenVPN
#          client it needs a TUN device, so it gets /dev/net/tun and
#          NET_ADMIN (nothing else).

name: softvpn-test${SVT_ID:-}

x-locked-down: &locked-down
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

networks:
  wan:
    ipam:
      config: [{ subnet: "${SVT_NET:-10.231}.10.0/24" }]
  edge:
    internal: true
    ipam:
      config: [{ subnet: "${SVT_NET:-10.231}.20.0/24" }]
  tapedge:
    internal: true
    ipam:
      config: [{ subnet: "${SVT_NET:-10.231}.30.0/24" }]
  dhcpedge:
    internal: true
    ipam:
      config: [{ subnet: "${SVT_NET:-10.231}.40.0/24" }]

volumes:
  pki:

services:
  # Creates the CA, certificates and client .ovpn profiles (idempotent).
  pki:
    &pki
    <<: *locked-down
    build: { context: .. }
    image: softvpn:test${SVT_ID:-}
    user: "65534:65534"
    network_mode: none
    volumes: [pki:/pki]
    # -shared: clients run as a different uid; demo volume only.
    command: [pki, init, -dir, /pki, -clients, "client1,client2,client3,revoked,tapclient1,tapclient2,tapclient3", -remote, server, -shared]

  # The image has no shell, so each further setup step is its own one-shot
  # container: revoke a certificate (writes /pki/crl.pem, which the server
  # checks with crl-verify) ...
  pki-revoke:
    <<: *pki
    build: !reset null
    depends_on: { pki: { condition: service_completed_successfully } }
    command: [pki, revoke, -dir, /pki, revoked]

  # ... write a profile without a certificate that asks for a password ...
  pki-alice:
    <<: *pki
    build: !reset null
    depends_on: { pki-revoke: { condition: service_completed_successfully } }
    command: [pki, init, -dir, /pki, -clients, alice, -remote, server, -no-cert, -shared]

  # ... and create the user database (auth-user-pass-file /pki/users).
  users:
    <<: *pki
    build: !reset null
    depends_on: { pki-alice: { condition: service_completed_successfully } }
    command: [user, add, -file, /pki/users, -password, opensesame, alice]

  # ... then control-channel keys (ta.key, tc.key, tls-crypt-v2.key and a
  # tls-crypt-v2 key per client) and profiles that embed them, all from
  # softvpn's own key generator. tlscryptv2-trial has no container: run.sh
  # uses it for throwaway trial clients.
  pki-tls-auth:
    <<: *pki
    build: !reset null
    depends_on: { users: { condition: service_completed_successfully } }
    command: [pki, init, -dir, /pki, -wrap, tls-auth, -clients, tlsauth-client, -remote, tlsauth-server, -shared]
  pki-tls-crypt:
    <<: *pki
    build: !reset null
    depends_on: { pki-tls-auth: { condition: service_completed_successfully } }
    command: [pki, init, -dir, /pki, -wrap, tls-crypt, -clients, tlscrypt-client, -remote, tlscrypt-server, -shared]
  pki-tls-crypt-v2:
    <<: *pki
    build: !reset null
    depends_on: { pki-tls-crypt: { condition: service_completed_successfully } }
    command: [pki, init, -dir, /pki, -wrap, tls-crypt-v2, -clients, "tlscryptv2-client,tlscryptv2-client25,tlscryptv2-trial", -remote, tlscryptv2-server, -shared]

  server:
    &server
    <<: *locked-down
    image: softvpn:test${SVT_ID:-}
    user: "65534:65534"
    depends_on:
      users: { condition: service_completed_successfully }
    command: [server, --config, /etc/softvpn/server.conf]
    volumes:
      - pki:/pki:ro
      - ./server.conf:/etc/softvpn/server.conf:ro
      - ./ccd:/etc/softvpn/ccd:ro
    tmpfs: ["/tmp:uid=65534,gid=65534"]
    networks:
      wan: { ipv4_address: "${SVT_NET:-10.231}.10.100" }
      edge: { ipv4_address: "${SVT_NET:-10.231}.20.100" }

  # TAP mode: a virtual Ethernet switch with a server-bridge address pool.
  tapserver:
    <<: *server
    volumes:
      - pki:/pki:ro
      - ./server-tap.conf:/etc/softvpn/server.conf:ro
    networks:
      wan: { ipv4_address: "${SVT_NET:-10.231}.10.101" }
      tapedge: { ipv4_address: "${SVT_NET:-10.231}.30.100", aliases: [server] }

  # TAP mode with "server-bridge" and no pool: clients use DHCP.
  dhcpserver:
    <<: *server
    volumes:
      - pki:/pki:ro
      - ./server-dhcp.conf:/etc/softvpn/server.conf:ro
    networks:
      wan: { ipv4_address: "${SVT_NET:-10.231}.10.102" }
      dhcpedge: { ipv4_address: "${SVT_NET:-10.231}.40.100", aliases: [server] }

  # The same server.conf plus control-channel protection on the command
  # line. tls-auth also uses a non-default HMAC digest ("auth SHA256").
  tlsauth-server:
    <<: *server
    depends_on:
      pki-tls-crypt-v2: { condition: service_completed_successfully }
    command: [server, --config, /etc/softvpn/server.conf, --tls-auth, /pki/ta.key, "0", --auth, SHA256]
    networks:
      wan: { ipv4_address: "${SVT_NET:-10.231}.10.111" }
      edge: { ipv4_address: "${SVT_NET:-10.231}.20.111" }
  tlscrypt-server:
    <<: *server
    depends_on:
      pki-tls-crypt-v2: { condition: service_completed_successfully }
    command: [server, --config, /etc/softvpn/server.conf, --tls-crypt, /pki/tc.key]
    networks:
      wan: { ipv4_address: "${SVT_NET:-10.231}.10.112" }
      edge: { ipv4_address: "${SVT_NET:-10.231}.20.112" }
  tlscryptv2-server:
    <<: *server
    depends_on:
      pki-tls-crypt-v2: { condition: service_completed_successfully }
    command: [server, --config, /etc/softvpn/server.conf, --tls-crypt-v2, /pki/tls-crypt-v2.key]
    networks:
      wan: { ipv4_address: "${SVT_NET:-10.231}.10.113" }
      edge: { ipv4_address: "${SVT_NET:-10.231}.20.113" }

  # Stand-in for the internet, reachable only from the server's network.
  web:
    <<: *locked-down
    build: ./tools
    image: softvpn-test-tools${SVT_ID:-}
    user: "65534:65534"
    command: [web.sh]
    networks:
      wan: { ipv4_address: "${SVT_NET:-10.231}.10.10" }

  client1:
    &client
    build: ./tools
    image: softvpn-test-tools${SVT_ID:-}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    depends_on: [server]
    volumes: [pki:/pki:ro]
    # Renegotiate data-channel keys every 15s (default is hourly) so the test
    # exercises OpenVPN's soft-reset path.
    command: [client-entrypoint.sh, --config, /pki/client1.ovpn, --reneg-sec, "15"]
    networks: [edge]

  # Same client over TCP, with a static address from client-config-dir and a
  # small HTTP service that client1 reaches via client-to-client routing.
  client2:
    <<: *client
    command: [client-entrypoint.sh, --config, /pki/client2.ovpn, --proto, tcp-client]
    environment: { SERVE_PORT: "8080" }

  # An older OpenVPN (2.5.10): no tls-ekm, so keys come from OpenVPN's legacy
  # PRF; and it only offers ChaCha20-Poly1305.
  client3:
    &client25
    <<: *client
    build: { context: ./tools, args: { ALPINE: "3.17" } }
    image: softvpn-test-tools${SVT_ID:-}:openvpn-2.5
    command: [client-entrypoint.sh, --config, /pki/client3.ovpn, --data-ciphers, CHACHA20-POLY1305]

  # No certificate: username and password only (verify-client-cert optional
  # on the server), authenticating as alice. Renegotiates every 15s, which
  # the server authorises with the auth-token it pushed (auth-gen-token).
  client4:
    <<: *client
    volumes: [pki:/pki:ro, ./auth:/auth:ro]
    command: [client-entrypoint.sh, --config, /pki/alice.ovpn, --auth-user-pass, /auth/alice.pass, --reneg-sec, "15"]

  # Same profile, wrong password: must get AUTH_FAILED.
  client5:
    <<: *client
    volumes: [pki:/pki:ro, ./auth:/auth:ro]
    command: [client-entrypoint.sh, --config, /pki/alice.ovpn, --auth-user-pass, /auth/wrong.pass]

  # A revoked certificate (pki revoke moved its profile to /pki/revoked/):
  # must be refused in the TLS handshake.
  client6:
    <<: *client
    command: [sh, -c, "exec client-entrypoint.sh --config /pki/revoked/revoked-*.ovpn"]

  # Control-channel protection: tls-auth (key-direction 1, HMAC-SHA256) over
  # UDP; tls-crypt over TCP, rekeying every 15s; tls-crypt-v2 with OpenVPN
  # 2.6 and with 2.5.
  tlsauth-client:
    <<: *client
    depends_on: [tlsauth-server]
    command: [client-entrypoint.sh, --config, /pki/tlsauth-client.ovpn, --auth, SHA256]
  tlscrypt-client:
    <<: *client
    depends_on: [tlscrypt-server]
    command: [client-entrypoint.sh, --config, /pki/tlscrypt-client.ovpn, --proto, tcp-client, --reneg-sec, "15"]
  tlscryptv2-client:
    <<: *client
    depends_on: [tlscryptv2-server]
    command: [client-entrypoint.sh, --config, /pki/tlscryptv2-client.ovpn]
  tlscryptv2-client25:
    <<: *client25
    depends_on: [tlscryptv2-server]
    command: [client-entrypoint.sh, --config, /pki/tlscryptv2-client25.ovpn]

  # On the same isolated network as the clients but without a VPN: shows that
  # nothing is reachable from "edge" except through the tunnel.
  probe:
    <<: *locked-down
    image: softvpn-test-tools${SVT_ID:-}
    user: "65534:65534"
    command: [sleep, infinity]
    networks: [edge]

  # TAP clients: the same stock clients with "dev tap". tapclient2 is
  # OpenVPN 2.5 over TCP and serves HTTP for the client-to-client check.
  tapclient1:
    <<: *client
    depends_on: [tapserver]
    command: [client-entrypoint.sh, --config, /pki/tapclient1.ovpn, --dev, tap]
    networks: [tapedge]

  tapclient2:
    <<: *client
    build: { context: ./tools, args: { ALPINE: "3.17" } }
    image: softvpn-test-tools${SVT_ID:-}:openvpn-2.5
    depends_on: [tapserver]
    command: [client-entrypoint.sh, --config, /pki/tapclient2.ovpn, --dev, tap, --proto, tcp-client]
    environment: { SERVE_PORT: "8080" }
    networks: [tapedge]

  # Gets no pushed ifconfig ("route-gateway dhcp"); run.sh runs udhcpc,
  # which also needs NET_RAW for its raw socket.
  tapclient3:
    <<: *client
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on: [dhcpserver]
    command: [client-entrypoint.sh, --config, /pki/tapclient3.ovpn, --dev, tap]
    networks: [dhcpedge]
