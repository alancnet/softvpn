# TAP (bridged) mode: clients get Ethernet frames, the server is a virtual
# switch whose gateway port answers ARP and NATs like tun mode.
port 1194
proto udp
proto tcp
dev tap
server-bridge 10.9.0.1 255.255.255.0 10.9.0.100 10.9.0.199

ca   /pki/ca.crt
cert /pki/server.crt
key  /pki/server.key
dh none

keepalive 10 60
client-to-client

push "redirect-gateway def1"
push "dhcp-option DNS 10.9.0.1"

verb 3
