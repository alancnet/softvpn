# A normal OpenVPN server.conf - softvpn reads it as-is.
port 1194
proto udp
proto tcp          # softvpn extension: several "proto" lines listen on each
dev tun
topology subnet
server 10.8.0.0 255.255.255.0
server-ipv6 fd00:8::/64

ca   /pki/ca.crt
cert /pki/server.crt
key  /pki/server.key
dh none

# Older clients: AES-256-CBC can be negotiated, and clients that cannot
# negotiate at all get AES-128-CBC. CBC packets carry an HMAC-SHA256.
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305:AES-256-CBC
data-ciphers-fallback AES-128-CBC
auth SHA256

# Compression framing comes from client-config-dir (it differs per client);
# "yes" also compresses what the server sends, to test both directions. The
# default, asym, only decompresses.
allow-compression yes

keepalive 10 60
client-to-client
client-config-dir /etc/softvpn/ccd

# Send all client traffic, IPv4 and IPv6, through the VPN; the server
# resolves DNS for them.
push "redirect-gateway def1 ipv6"
push "dhcp-option DNS 10.8.0.1"

# siteclient's LAN (iroute in ccd/siteclient) is given on the command line in
# docker-compose.yml, because its subnet depends on SVT_NET:
#   route NETWORK NETMASK, route-ipv6 PREFIX, push "route ...", push "route-ipv6 ..."

status /tmp/softvpn-status.log 5
verb 3

# Client authentication. Certificates are checked against the CRL that
# "softvpn pki revoke" maintains; clients without a certificate log in with a
# username and password from the built-in user database instead.
crl-verify /pki/crl.pem
auth-user-pass-file /pki/users
verify-client-cert optional
auth-user-pass-optional      # certificate clients need no password
username-as-common-name
auth-gen-token               # renegotiate with a token, not the password
